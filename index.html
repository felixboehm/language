    body {

        background: #f0fdf4;

        right: 15px;

        border: 2px solid #e9ecef;

                    examples: [
                        { pt: "Eu estou cansado.", de: "Ich bin müde.", exp: "estou = ich bin" },
                        { pt: "Tu estás feliz.", de: "Du bist glücklich.", exp: "estás = du bist" },
                        { pt: "Ele está no escritório.", de: "Er ist im Büro.", exp: "está = er ist" },
                        { pt: "Nós estamos prontos.", de: "Wir sind bereit.", exp: "estamos = wir sind" },
                        { pt: "Vós estais atrasados.", de: "Ihr seid zu spät.", exp: "estais = ihr seid" },
                        { pt: "Eles estão em férias.", de: "Sie sind im Urlaub.", exp: "estão = sie sind" }
                    ],
                    gerund: { pt: "Estando doente, não posso trabalhar.", de: "Da ich krank bin, kann ich nicht arbeiten.", exp: "Estando = seiend" }
                },
                {
                    id: 3,
                    verb: "TER",
                    translation: "haben",
                    conjugation: "eu tenho, tu tens, ele/ela tem, nós temos, eles/elas têm",
                    examples: [
                        { pt: "Eu tenho uma casa.", de: "Ich habe ein Haus.", exp: "tenho = ich habe" },
                        { pt: "Tu tens dois irmãos?", de: "Hast du zwei Geschwister?", exp: "tens = du hast" },
                        { pt: "Ela tem talento.", de: "Sie hat Talent.", exp: "tem = sie hat" },
                        { pt: "Nós temos uma reunião.", de: "Wir haben ein Meeting.", exp: "temos = wir haben" },
                        { pt: "Vós tendes razão.", de: "Ihr habt Recht.", exp: "tendes = ihr habt" },
                        { pt: "Eles têm três filhos.", de: "Sie haben drei Kinder.", exp: "têm = sie haben" }
                    ],
                    gerund: { pt: "Tendo tempo, vou ler.", de: "Wenn ich Zeit habe, werde ich lesen.", exp: "Tendo = habend" }
                },
                {
                    id: 4,
                    verb: "FAZER",
                    translation: "machen",
                    conjugation: "eu faço, tu fazes, ele/ela faz, nós fazemos, eles/elas fazem",
                    examples: [
                        { pt: "Eu faço o pequeno-almoço.", de: "Ich mache das Frühstück.", exp: "faço = ich mache" },
                        { pt: "Tu fazes um bom trabalho.", de: "Du machst gute Arbeit.", exp: "fazes = du machst" },
                        { pt: "Ele faz exercício.", de: "Er macht Sport.", exp: "faz = er macht" },
                        { pt: "Nós fazemos as compras.", de: "Wir machen die Einkäufe.", exp: "fazemos = wir machen" },

                        { pt: "Eles fazem voluntariado.", de: "Sie machen Freiwilligenarbeit.", exp: "fazem = sie machen" }
                    ],
                    gerund: { pt: "Fazendo isto bem, terás sucesso.", de: "Wenn du das gut machst, wirst du Erfolg haben.", exp: "Fazendo = machend" }
                },
                {
                    id: 5,
                    verb: "IR",
                    translation: "gehen",
                    conjugation: "eu vou, tu vais, ele/ela vai, nós vamos, eles/elas vão",
                    examples: [
                        { pt: "Eu vou ao supermercado.", de: "Ich gehe zum Supermarkt.", exp: "vou = ich gehe" },
                        { pt: "Tu vais à praia?", de: "Gehst du zum Strand?", exp: "vais = du gehst" },
                        { pt: "Ela vai estudar medicina.", de: "Sie wird Medizin studieren.", exp: "vai = sie geht/wird" },
                        { pt: "Nós vamos jantar fora.", de: "Wir gehen auswärts essen.", exp: "vamos = wir gehen" },
                        { pt: "Vós ides ao concerto?", de: "Geht ihr zum Konzert?", exp: "ides = ihr geht" },
                        { pt: "Eles vão viajar.", de: "Sie werden reisen.", exp: "vão = sie gehen/werden" }
                    ],
                    gerund: { pt: "Indo devagar, chegas longe.", de: "Langsam gehend, kommst du weit.", exp: "Indo = gehend" }
                }
            ]
        },
        {
            id: 2,
            titel: "Modalverben",
            beschreibung: "Können, wollen, müssen",
            farbe: "#f59e0b",
            verben: [
                {
                    id: 6,
                    verb: "QUERER",
                    translation: "wollen",
                    conjugation: "eu quero, tu queres, ele/ela quer, nós queremos, eles/elas querem",
                    examples: [
                        { pt: "Eu quero aprender português.", de: "Ich will Portugiesisch lernen.", exp: "quero = ich will" },
                        { pt: "Tu queres vir connosco?", de: "Willst du mit uns kommen?", exp: "queres = du willst" },
                        { pt: "Ele quer mudar de emprego.", de: "Er will den Job wechseln.", exp: "quer = er will" },
                        { pt: "Nós queremos uma casa nova.", de: "Wir wollen ein neues Haus.", exp: "queremos = wir wollen" },
                        { pt: "Vós quereis descansar?", de: "Wollt ihr ausruhen?", exp: "quereis = ihr wollt" },
                        { pt: "Eles querem viajar.", de: "Sie wollen reisen.", exp: "querem = sie wollen" }
                    ],
                    gerund: { pt: "Querendo ou não, tens de ir.", de: "Ob du willst oder nicht, du musst gehen.", exp: "Querendo = wollend" }
                },
                {
                    id: 7,
                    verb: "PODER",
                    translation: "können",
                    conjugation: "eu posso, tu podes, ele/ela pode, nós podemos, eles/elas podem",
                    examples: [
                        { pt: "Eu posso ajudar.", de: "Ich kann helfen.", exp: "posso = ich kann" },
                        { pt: "Tu podes fechar a janela?", de: "Kannst du das Fenster schließen?", exp: "podes = du kannst" },
                        { pt: "Ela pode falar três línguas.", de: "Sie kann drei Sprachen sprechen.", exp: "pode = sie kann" },
                        { pt: "Nós podemos marcar uma reunião.", de: "Wir können ein Meeting vereinbaren.", exp: "podemos = wir können" },
                        { pt: "Vós podeis chegar mais cedo?", de: "Könnt ihr früher ankommen?", exp: "podeis = ihr könnt" },
                        { pt: "Eles podem trazer os documentos.", de: "Sie können die Dokumente mitbringen.", exp: "podem = sie können" }
                    ],
                    gerund: { pt: "Podendo escolher, prefiro casa.", de: "Wenn ich wählen kann, bevorzuge ich zu Hause.", exp: "Podendo = könnend" }
                }
            ]
        }
    ];

    // State
    let currentLesson = null;
    let completedLessons = JSON.parse(localStorage.getItem('completedLessons') || '[]');
    let learnedVocabulary = JSON.parse(localStorage.getItem('learnedVocabulary') || '[]');
    let currentFilter = 'all';
    let isPlaying = false;
    let isPaused = false;
    let playQueue = [];
    let currentElement = null;
    let synth = window.speechSynthesis;
    let currentUtterance = null;

    // Init
    function init() {
        renderLessons();
    }

    function renderLessons() {
        const grid = document.getElementById('lessons-grid');
        grid.innerHTML = LESSONS.map(lesson => {
            const isCompleted = completedLessons.includes(lesson.id);
            return `
                <div class="lesson-card ${isCompleted ? 'completed' : ''}" 
                     style="border-color: ${lesson.farbe};"
                     onclick="openLesson(${lesson.id})">
                    <div class="lesson-number" style="color: ${lesson.farbe};">${lesson.id}</div>
                    <div class="lesson-title">${lesson.titel}</div>
                    <div class="lesson-desc">${lesson.beschreibung}</div>
                    <div>${lesson.verben.length} Verben</div>
                </div>
            `;
        }).join('');
    }

    function openLesson(id) {
        currentLesson = LESSONS.find(l => l.id === id);
        if (!currentLesson) return;

        document.getElementById('overview').classList.add('hidden');
        document.getElementById('detail').classList.remove('hidden');
        document.getElementById('floating-controls').classList.remove('hidden');

        const isCompleted = completedLessons.includes(id);
        document.getElementById('lesson-header').innerHTML = `
            <h2>Lektion ${currentLesson.id}: ${currentLesson.titel}</h2>
            <p>${currentLesson.beschreibung}</p>
            <p>${currentLesson.verben.length} Verben ${isCompleted ? '✓ Abgeschlossen' : ''}</p>
        `;

        const verbsDiv = document.getElementById('verbs');
        verbsDiv.innerHTML = currentLesson.verben.map((verb, verbIdx) => {
            const examplesHTML = verb.examples.map((ex, i) => `
                <div class="example" data-verb="${verbIdx}" data-example="${i}" data-sentence="${ex.pt}">
                    <button class="mark-sentence-btn" onclick="markSentenceVocab(event, '${ex.pt.replace(/'/g, "\\'")}')">✓ Wörter gelernt</button>
                    <div class="example-pt" onclick="handleSentenceClick(event, '${ex.pt.replace(/'/g, "\\'")}', this)">
                        🔊 ${ex.pt}
                    </div>
                    <div class="example-de">${ex.de}</div>
                </div>
            `).join('');

            const gerundHTML = verb.gerund ? `
                <div class="example gerund" data-verb="${verbIdx}" data-gerund="true" data-sentence="${verb.gerund.pt}">
                    <button class="mark-sentence-btn" onclick="markSentenceVocab(event, '${verb.gerund.pt.replace(/'/g, "\\'")}')">✓ Wörter gelernt</button>
                    <div style="font-size: 0.75em; color: #0ea5e9; font-weight: 600; margin-bottom: 5px;">GERUNDIUM</div>
                    <div class="example-pt" onclick="handleSentenceClick(event, '${verb.gerund.pt.replace(/'/g, "\\'")}', this)">
                        🔊 ${verb.gerund.pt}
                    </div>
                    <div class="example-de">${verb.gerund.de}</div>
                </div>
            ` : '';

            return `
                <div class="verb-card">
                    <div class="verb-header">
                        <div class="verb-title">${verb.verb}</div>
                        <div>#${verb.id}</div>
                    </div>
                    <div style="color: #666; margin-bottom: 15px; font-size: 1.1em;">${verb.translation}</div>
                    <div class="conjugation">${verb.conjugation}</div>
                    ${examplesHTML}
                    ${gerundHTML}
                </div>
            `;
        }).join('');

        // Extract and display vocabulary
        const vocabulary = extractVocabulary(currentLesson);
        verbsDiv.innerHTML += `
            <div class="vocab-section">
                <h3>📚 Vokabeln dieser Lektion (${vocabulary.length})</h3>
                <div class="vocab-grid">
                    ${vocabulary.map((v, idx) => {
                        const vocabId = `${currentLesson.id}-${v.pt}`;
                        const isLearned = learnedVocabulary.includes(vocabId);
                        return `
                            <div class="vocab-item ${isLearned ? 'learned' : ''}" onclick="toggleVocab('${vocabId}', this)">
                                <div class="vocab-pt">${v.pt}</div>
                                <div class="vocab-de">${v.de}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }

    function toggleVocab(vocabId, element) {
        const index = learnedVocabulary.indexOf(vocabId);
        if (index > -1) {
            learnedVocabulary.splice(index, 1);
            element.classList.remove('learned');
        } else {
            learnedVocabulary.push(vocabId);
            element.classList.add('learned');
        }
        localStorage.setItem('learnedVocabulary', JSON.stringify(learnedVocabulary));
    }

    function extractVocabulary(lesson) {
        // Define vocabulary mappings based on the lesson content
        const vocabMap = {
            // Lektion 1 - Grundlagen
            'alemão': 'Deutscher',
            'inteligente': 'intelligent',
            'médica': 'Ärztin',

    function backToOverview() {
        stopLesson();
        document.getElementById('detail').classList.add('hidden');
        document.getElementById('overview').classList.remove('hidden');
        document.getElementById('floating-controls').classList.add('hidden');

    function speak(text, element, manualClick = false) {
        if (!synth) return;
        
        synth.cancel();
        document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
        
        // Find the example container for scrolling
        if (element) {
            currentElement = element.closest('.example');
            if (currentElement) {
                currentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            element.classList.add('playing');
        }

        // If manually clicked on a sentence
        if (manualClick && currentElement) {
            const verbIdx = parseInt(currentElement.dataset.verb);
            const isGerund = currentElement.dataset.gerund === 'true';
            
            // If autoplay is on, rebuild queue from this point
            if (isPlaying) {
                playQueue = [];
                let foundCurrent = false;
                
                currentLesson.verben.forEach((verb, vIdx) => {
                    verb.examples.forEach((ex, exIdx) => {
                        // Skip until we find current sentence
                        if (!foundCurrent) {
                            if (vIdx === verbIdx && !isGerund && currentElement.dataset.example === String(exIdx)) {
                                foundCurrent = true;
                                // Don't add current one, it's already playing
                            } else {
                                return; // Skip
                            }
                        } else {
                            // Check if this sentence is filtered out
                            const selector = `.example[data-verb="${vIdx}"][data-example="${exIdx}"]`;
                            const element = document.querySelector(selector);
                            if (element && !element.classList.contains('hidden-filter')) {
                                playQueue.push({ 
                                    text: ex.pt, 
                                    verbIdx: vIdx, 
                                    exampleIdx: exIdx,
                                    isGerund: false
                                });
                            }
                        }
                    });
                    
                    if (verb.gerund) {
                        if (!foundCurrent) {
                            if (vIdx === verbIdx && isGerund) {
                                foundCurrent = true;
                                // Don't add current one
                            }
                        } else {
                            // Check if this gerund sentence is filtered out
                            const selector = `.example[data-verb="${vIdx}"][data-gerund="true"]`;
                            const element = document.querySelector(selector);
                            if (element && !element.classList.contains('hidden-filter')) {
                                playQueue.push({ 
                                    text: verb.gerund.pt, 
                                    verbIdx: vIdx,
                                    isGerund: true
                                });
                            }
                        }
                    }
                });
            }
            // If autoplay is off, just play this one sentence (queue stays empty)
        }

        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.lang = 'pt-PT';
        currentUtterance.rate = 0.8;

        currentUtterance.onend = () => {
            if (element) element.classList.remove('playing');
            currentElement = null;
            
            if (playQueue.length > 0 && isPlaying && !isPaused) {
                const next = playQueue.shift();
                setTimeout(() => {
                    // Find the element to highlight
                    const selector = next.isGerund 
                        ? `.example[data-verb="${next.verbIdx}"][data-gerund="true"]`
                        : `.example[data-verb="${next.verbIdx}"][data-example="${next.exampleIdx}"]`;
                    const nextElement = document.querySelector(selector);
                    const playElement = nextElement ? nextElement.querySelector('.example-pt') : null;
                    speak(next.text, playElement, false);
                }, 1000);
            } else if (isPlaying && playQueue.length === 0 && !isPaused) {
                const nextLesson = LESSONS.find(l => l.id === currentLesson.id + 1);
                if (nextLesson) {
                    setTimeout(() => {
                        openLesson(nextLesson.id);
                        playLesson();
                    }, 2000);
                } else {
                    stopLesson();
                    alert('🎉 Alle Lektionen abgeschlossen!');
                }
            }
        };

        synth.speak(currentUtterance);
    }

    function playLesson() {
        if (!currentLesson) return;

        // If resuming from pause
        if (isPaused) {
            isPaused = false;
            synth.resume();
            updateFloatingButtons();
            return;
        }

        isPlaying = true;
        isPaused = false;
        document.getElementById('playBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
        updateFloatingButtons();

        playQueue = [];
        currentLesson.verben.forEach((verb, verbIdx) => {
            verb.examples.forEach((ex, exampleIdx) => {
                // Check if this sentence is filtered out
                const selector = `.example[data-verb="${verbIdx}"][data-example="${exampleIdx}"]`;
                const element = document.querySelector(selector);
                if (element && !element.classList.contains('hidden-filter')) {
                    playQueue.push({ 
                        text: ex.pt, 
                        verbIdx: verbIdx, 
                        exampleIdx: exampleIdx,
                        isGerund: false
                    });
                }
            });
            if (verb.gerund) {
                // Check if this gerund sentence is filtered out
                const selector = `.example[data-verb="${verbIdx}"][data-gerund="true"]`;
                const element = document.querySelector(selector);
                if (element && !element.classList.contains('hidden-filter')) {
                    playQueue.push({ 
                        text: verb.gerund.pt, 
                        verbIdx: verbIdx,
                        isGerund: true
                    });
                }
            }
        });

        if (playQueue.length > 0) {
            const first = playQueue.shift();
            const selector = first.isGerund 
                ? `.example[data-verb="${first.verbIdx}"][data-gerund="true"]`
                : `.example[data-verb="${first.verbIdx}"][data-example="${first.exampleIdx}"]`;
            const element = document.querySelector(selector);
            const playElement = element ? element.querySelector('.example-pt') : null;
            speak(first.text, playElement);
        }
    }

    function pauseLesson() {
        if (!isPlaying || isPaused) return;
        
        isPaused = true;
        synth.pause();
        updateFloatingButtons();
    }

    function updateFloatingButtons() {
        const playBtn = document.getElementById('floatingPlayBtn');
        const pauseBtn = document.getElementById('floatingPauseBtn');
        
        if (isPlaying && !isPaused) {
            playBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
        } else {
            playBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
        }
    }

    function stopLesson() {
        isPlaying = false;
        isPaused = false;
        playQueue = [];
        synth.cancel();
        document.getElementById('playBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
        document.querySelectorAll('.playing').forEach(el => el.classList.remove('playing'));
        updateFloatingButtons();
    }

    function handleSentenceClick(event, text, element) {
        // Check if click is on right side (for marking as learned)
        const rect = element.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const width = rect.width;
        
        // Right 30% of the sentence = mark as learned
        if (clickX > width * 0.7) {
            markSentenceVocab(event, text);
        } else {
            // Left side = play/continue
            speak(text, element, true);
        }
    }

    function markSentenceVocab(event, sentence) {
        event.stopPropagation();
        
        // Extract words from sentence
        const words = sentence.toLowerCase().match(/\b[\wáàâãéêíóôõúçü-]+\b/g) || [];
        
        // Get vocabulary map
        const vocabMap = getVocabularyMap();
        
        let markedCount = 0;
        words.forEach(word => {
            if (vocabMap[word]) {
                const vocabId = `${currentLesson.id}-${word}`;
                if (!learnedVocabulary.includes(vocabId)) {
                    learnedVocabulary.push(vocabId);
                    markedCount++;
                }
            }
        });
        
        if (markedCount > 0) {
            localStorage.setItem('learnedVocabulary', JSON.stringify(learnedVocabulary));
            
            // Update vocabulary display
            words.forEach(word => {
                if (vocabMap[word]) {
                    const vocabId = `${currentLesson.id}-${word}`;
                    const vocabElements = document.querySelectorAll(`.vocab-item[onclick*="${vocabId}"]`);
                    vocabElements.forEach(el => el.classList.add('learned'));
                }
            });
            
            // Apply filter if active
            if (currentFilter === 'unlearned') {
                filterSentences('unlearned');
            }
        }
    }

    function filterSentences(filter) {
        currentFilter = filter;
        
        // Update button styles
        document.getElementById('filterAll').style.background = filter === 'all' ? '#667eea' : '#e5e7eb';
        document.getElementById('filterAll').style.color = filter === 'all' ? 'white' : '#333';
        document.getElementById('filterUnlearned').style.background = filter === 'unlearned' ? '#667eea' : '#e5e7eb';
        document.getElementById('filterUnlearned').style.color = filter === 'unlearned' ? 'white' : '#333';
        
        if (filter === 'all') {
            // Show all sentences
            document.querySelectorAll('.example').forEach(ex => {
                ex.classList.remove('hidden-filter');
            });
        } else if (filter === 'unlearned') {
            // Show only sentences with unlearned vocabulary
            const vocabMap = getVocabularyMap();
            
            document.querySelectorAll('.example').forEach(ex => {
                const sentence = ex.dataset.sentence;
                if (!sentence) return;
                
                const words = sentence.toLowerCase().match(/\b[\wáàâãéêíóôõúçü-]+\b/g) || [];
                
                // Check if sentence has any unlearned vocab
                let hasUnlearnedVocab = false;
                words.forEach(word => {
                    if (vocabMap[word]) {
                        const vocabId = `${currentLesson.id}-${word}`;
                        if (!learnedVocabulary.includes(vocabId)) {
                            hasUnlearnedVocab = true;
                        }
                    }
                });
                
                if (hasUnlearnedVocab) {
                    ex.classList.remove('hidden-filter');
                } else {
                    ex.classList.add('hidden-filter');
                }
            });
        }
    }
