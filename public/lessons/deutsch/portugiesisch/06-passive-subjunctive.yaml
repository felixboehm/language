number: 6
title: "Passiv und Konjunktiv"
description: "Lernen Sie die Passivformen und den Konjunktiv im Portugiesischen"
sections:
  - title: "Passiv mit SER"
    explanation: |
      Das **Passiv** wird mit **ser + Partizip Perfekt** gebildet:
      Das Partizip stimmt in Geschlecht und Zahl mit dem Subjekt überein.
      
      **Bildung Partizip**: -AR → -ado, -ER/-IR → -ido
      (z.B. falar → falado, comer → comido, partir → partido)
    examples:
      - q: "O livro é lido por muitas pessoas."
        a: "Das Buch wird von vielen Leuten gelesen."
        labels: ["Passiv"]
        rel:
          - ["é lido", "wird gelesen", "passiv - ler"]
          - ["livro", "Buch", "noun"]
          - ["pessoas", "Leute", "noun"]
      - q: "A casa foi construída em 1950."
        a: "Das Haus wurde 1950 gebaut."
        labels: ["Passiv", "Past"]
        rel:
          - ["foi construída", "wurde gebaut", "passiv past - construir"]
          - ["casa", "Haus", "noun"]
          - ["construída", "gebaut (fem.)", "participle"]
      - q: "As cartas são escritas à mão."
        a: "Die Briefe werden von Hand geschrieben."
        labels: ["Passiv"]
        rel:
          - ["são escritas", "werden geschrieben", "passiv - escrever"]
          - ["cartas", "Briefe", "noun"]
          - ["escritas", "geschrieben (fem. pl.)", "participle"]
          - ["à mão", "von Hand", "expression"]
      - q: "O problema será resolvido amanhã."
        a: "Das Problem wird morgen gelöst werden."
        labels: ["Passiv", "Futur"]
        rel:
          - ["será resolvido", "wird gelöst werden", "passiv future - resolver"]
          - ["problema", "Problem", "noun"]
          - ["amanhã", "morgen", "adverb"]
  
  - title: "Passiv mit SE"
    explanation: |
      In der Umgangssprache wird oft **se** verwendet statt des Passivs:
      Dies ist besonders häufig, wenn kein Agens (Täter) genannt wird.
      
      Konstruktion: **se + Verb in 3. Person**
    examples:
      - q: "Fala-se português aqui."
        a: "Hier wird Portugiesisch gesprochen."
        labels: ["Passiv"]
        rel:
          - ["fala-se", "wird gesprochen", "passiv mit se"]
          - ["português", "Portugiesisch", "noun"]
          - ["aqui", "hier", "adverb"]
      - q: "Vendem-se casas."
        a: "Häuser werden verkauft."
        labels: ["Passiv"]
        rel:
          - ["vendem-se", "werden verkauft", "passiv mit se"]
          - ["casas", "Häuser", "noun"]
      - q: "Procura-se secretária."
        a: "Sekretärin wird gesucht."
        labels: ["Passiv"]
        rel:
          - ["procura-se", "wird gesucht", "passiv mit se"]
          - ["secretária", "Sekretärin", "noun"]
      - q: "Aluga-se apartamento."
        a: "Wohnung zu vermieten."
        labels: ["Passiv"]
        rel:
          - ["aluga-se", "wird vermietet", "passiv mit se"]
          - ["apartamento", "Wohnung", "noun"]
  
  - title: "Konjunktiv Präsens"
    explanation: |
      Der **Conjuntivo Presente** (Konjunktiv Präsens) wird verwendet für:
      - Wünsche und Hoffnungen
      - Zweifel und Unsicherheit
      - Nach bestimmten Ausdrücken (talvez, espero que, é importante que)
      
      **Bildung**: Bei regelmäßigen Verben vertauschen -AR und -ER/-IR Endungen.
    examples:
      - q: "Espero que ele venha."
        a: "Ich hoffe, dass er kommt."
        labels: ["Konjunktiv"]
        rel:
          - ["venha", "komme (er/sie)", "konjunktiv - vir"]
          - ["espero que", "ich hoffe, dass", "expression"]
      - q: "Talvez ela esteja em casa."
        a: "Vielleicht ist sie zu Hause."
        labels: ["Konjunktiv"]
        rel:
          - ["talvez", "vielleicht", "adverb"]
          - ["esteja", "sei (sie/er)", "konjunktiv - estar"]
          - ["casa", "Haus/Zuhause", "noun"]
      - q: "É importante que vocês estudem."
        a: "Es ist wichtig, dass ihr lernt."
        labels: ["Konjunktiv"]
        rel:
          - ["é importante que", "es ist wichtig, dass", "expression"]
          - ["estudem", "lernt (ihr/sie)", "konjunktiv - estudar"]
      - q: "Quero que tu fales comigo."
        a: "Ich will, dass du mit mir sprichst."
        labels: ["Konjunktiv"]
        rel:
          - ["quero que", "ich will, dass", "expression"]
          - ["fales", "sprichst (du)", "konjunktiv - falar"]
      - q: "Duvido que eles saibam."
        a: "Ich bezweifle, dass sie es wissen."
        labels: ["Konjunktiv"]
        rel:
          - ["duvido que", "ich bezweifle, dass", "expression"]
          - ["saibam", "wissen (sie)", "konjunktiv - saber"]
  
  - title: "Konjunktiv in Bedingungssätzen"
    explanation: |
      Der Konjunktiv wird auch in Bedingungssätzen verwendet:
      - **Se + Konjunktiv** für Zukunft oder Unsicherheit
      - Nach **caso** (falls), **embora** (obwohl), **antes que** (bevor)
    examples:
      - q: "Se ele vier, ficarei feliz."
        a: "Wenn er kommt, werde ich glücklich sein."
        labels: ["Konjunktiv", "Futur"]
        rel:
          - ["vier", "komme (er/sie)", "konjunktiv futuro - vir"]
          - ["ficarei", "werde sein (ich)", "futuro - ficar"]
          - ["feliz", "glücklich", "adjective"]
      - q: "Caso tenhas tempo, liga-me."
        a: "Falls du Zeit hast, ruf mich an."
        labels: ["Konjunktiv"]
        rel:
          - ["caso", "falls", "conjunction"]
          - ["tenhas", "hast (du)", "konjunktiv - ter"]
          - ["liga-me", "ruf mich an", "verb + pronoun"]
      - q: "Embora seja difícil, vou tentar."
        a: "Obwohl es schwierig ist, werde ich es versuchen."
        labels: ["Konjunktiv"]
        rel:
          - ["embora", "obwohl", "conjunction"]
          - ["seja", "sei (es/er/sie)", "konjunktiv - ser"]
          - ["difícil", "schwierig", "adjective"]
      - q: "Antes que seja tarde demais."
        a: "Bevor es zu spät ist."
        labels: ["Konjunktiv"]
        rel:
          - ["antes que", "bevor", "conjunction"]
          - ["seja", "sei (es)", "konjunktiv - ser"]
          - ["tarde demais", "zu spät", "expression"]
