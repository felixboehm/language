number: 4
title: "Vergangenheit - Pretérito Perfeito"
description: "Lernen Sie die einfache Vergangenheitsform im Portugiesischen"
sections:
  - title: "Regelmäßige Verben - AR"
    explanation: |
      **Pretérito Perfeito** ist die häufigste Vergangenheitsform für abgeschlossene Handlungen.
      Regelmäßige Verben auf **-AR** haben folgende Endungen:
      - eu -ei, tu -aste, ele/ela -ou
      - nós -ámos, vós -astes, eles/elas -aram
      
      **Beispiel FALAR (sprechen)**: eu falei, tu falaste, ele falou, nós falámos, eles falaram
    examples:
      - q: "Eu falei com o chefe ontem."
        a: "Ich habe gestern mit dem Chef gesprochen."
        labels: ["Past"]
        rel:
          - ["falei", "habe gesprochen (ich)", "verb - falar (Past)"]
          - ["ontem", "gestern", "adverb"]
          - ["chefe", "Chef", "noun"]
      - q: "Tu estudaste muito."
        a: "Du hast viel gelernt."
        labels: ["Past"]
        rel:
          - ["estudaste", "hast gelernt (du)", "verb - estudar (Past)"]
          - ["muito", "viel", "adverb"]
      - q: "Ela trabalhou no escritório."
        a: "Sie hat im Büro gearbeitet."
        labels: ["Past"]
        rel:
          - ["trabalhou", "hat gearbeitet (sie/er)", "verb - trabalhar (Past)"]
          - ["escritório", "Büro", "noun"]
      - q: "Nós viajámos para Portugal."
        a: "Wir sind nach Portugal gereist."
        labels: ["Past"]
        rel:
          - ["viajámos", "sind gereist (wir)", "verb - viajar (Past)"]
          - ["Portugal", "Portugal", "proper noun"]
      - q: "Eles chegaram tarde."
        a: "Sie sind spät angekommen."
        labels: ["Past"]
        rel:
          - ["chegaram", "sind angekommen (sie)", "verb - chegar (Past)"]
          - ["tarde", "spät", "adverb"]
  
  - title: "Regelmäßige Verben - ER und IR"
    explanation: |
      Verben auf **-ER** und **-IR** haben dieselben Endungen im Pretérito Perfeito:
      - eu -i, tu -este, ele/ela -eu
      - nós -emos/-imos, vós -estes/-istes, eles/elas -eram/-iram
      
      **Beispiel COMER (essen)**: eu comi, tu comeste, ele comeu, nós comemos
      **Beispiel PARTIR (abreisen)**: eu parti, tu partiste, ele partiu, nós partimos
    examples:
      - q: "Eu comi uma pizza."
        a: "Ich habe eine Pizza gegessen."
        labels: ["Past"]
        rel:
          - ["comi", "habe gegessen (ich)", "verb - comer (Past)"]
          - ["pizza", "Pizza", "noun"]
      - q: "Tu bebeste vinho?"
        a: "Hast du Wein getrunken?"
        labels: ["Past"]
        rel:
          - ["bebeste", "hast getrunken (du)", "verb - beber (Past)"]
          - ["vinho", "Wein", "noun"]
      - q: "Ele partiu cedo."
        a: "Er ist früh abgereist."
        labels: ["Past"]
        rel:
          - ["partiu", "ist abgereist (er/sie)", "verb - partir (Past)"]
          - ["cedo", "früh", "adverb"]
      - q: "Nós vimos o filme."
        a: "Wir haben den Film gesehen."
        labels: ["Past"]
        rel:
          - ["vimos", "haben gesehen (wir)", "verb - ver (Past)"]
          - ["filme", "Film", "noun"]
      - q: "Elas abriram a porta."
        a: "Sie haben die Tür geöffnet."
        labels: ["Past"]
        rel:
          - ["abriram", "haben geöffnet (sie)", "verb - abrir (Past)"]
          - ["porta", "Tür", "noun"]
  
  - title: "Unregelmäßige Verben"
    explanation: |
      Einige häufig verwendete Verben sind im Pretérito Perfeito unregelmäßig:
      - **SER/IR**: fui, foste, foi, fomos, foram
      - **TER**: tive, tiveste, teve, tivemos, tiveram
      - **ESTAR**: estive, estiveste, esteve, estivemos, estiveram
      - **FAZER**: fiz, fizeste, fez, fizemos, fizeram
    examples:
      - q: "Eu fui ao cinema."
        a: "Ich bin ins Kino gegangen."
        labels: ["Past"]
        rel:
          - ["fui", "bin gegangen / war (ich)", "verb - ir/ser (Past)"]
          - ["cinema", "Kino", "noun"]
      - q: "Tu foste médico?"
        a: "Warst du Arzt?"
        labels: ["Past"]
        rel:
          - ["foste", "warst (du)", "verb - ser (Past)"]
          - ["médico", "Arzt", "noun"]
      - q: "Ele teve sorte."
        a: "Er hatte Glück."
        labels: ["Past"]
        rel:
          - ["teve", "hatte (er/sie)", "verb - ter (Past)"]
          - ["sorte", "Glück", "noun"]
      - q: "Nós fizemos o trabalho."
        a: "Wir haben die Arbeit gemacht."
        labels: ["Past"]
        rel:
          - ["fizemos", "haben gemacht (wir)", "verb - fazer (Past)"]
          - ["trabalho", "Arbeit", "noun"]
      - q: "Eles estiveram na praia."
        a: "Sie waren am Strand."
        labels: ["Past"]
        rel:
          - ["estiveram", "waren (sie)", "verb - estar (Past)"]
          - ["praia", "Strand", "noun"]
