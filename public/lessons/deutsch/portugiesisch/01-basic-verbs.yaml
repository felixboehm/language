number: 1
title: "Basic Verbs - Ser and Estar"
description: "Learn the fundamental Portuguese verbs for 'to be' - permanent vs temporary states"
sections:
  - title: "SER - Permanentes Sein"
    explanation: |
      **SER** wird für permanente oder inhärente Eigenschaften verwendet:
      - Identität (Nationalität, Beruf)
      - Eigenschaften (Persönlichkeit, physische Merkmale)
      - Besitz und Beziehungen
      
      **Konjugation**: eu sou, tu és, ele/ela é, nós somos, vós sois, eles/elas são
    examples:
      - q: "Eu sou alemão."
        a: "Ich bin Deutscher."
        rel:
          - ["sou", "bin (ich)", "verb - ser"]
          - ["alemão", "Deutscher", "noun"]
      - q: "Tu és inteligente."
        a: "Du bist intelligent."
        rel:
          - ["és", "bist (du)", "verb - ser"]
          - ["inteligente", "intelligent", "adjective"]
      - q: "Ela é médica."
        a: "Sie ist Ärztin."
        rel:
          - ["é", "ist (sie/er)", "verb - ser"]
          - ["médica", "Ärztin", "noun"]
      - q: "Nós somos uma equipa."
        a: "Wir sind ein Team."
        rel:
          - ["somos", "sind (wir)", "verb - ser"]
          - ["equipa", "Team", "noun"]
      - q: "Eles são programadores."
        a: "Sie sind Programmierer."
        rel:
          - ["são", "sind (sie)", "verb - ser"]
          - ["programadores", "Programmierer", "noun"]
  
  - title: "ESTAR - Temporäres Sein"
    explanation: |
      **ESTAR** wird für temporäre Zustände oder Orte verwendet:
      - Emotionen und Gefühle
      - Physischer Standort
      - Temporäre Bedingungen oder Zustände
      
      **Konjugation**: eu estou, tu estás, ele/ela está, nós estamos, vós estais, eles/elas estão
    examples:
      - q: "Eu estou cansado."
        a: "Ich bin müde."
        rel:
          - ["estou", "bin (ich)", "verb - estar"]
          - ["cansado", "müde", "adjective"]
      - q: "Tu estás feliz."
        a: "Du bist glücklich."
        rel:
          - ["estás", "bist (du)", "verb - estar"]
          - ["feliz", "glücklich", "adjective"]
      - q: "Ele está no escritório."
        a: "Er ist im Büro."
        rel:
          - ["está", "ist (er/sie)", "verb - estar"]
          - ["escritório", "Büro", "noun"]
          - ["no", "im (in dem)", "preposition"]
      - q: "Nós estamos prontos."
        a: "Wir sind bereit."
        rel:
          - ["estamos", "sind (wir)", "verb - estar"]
          - ["prontos", "bereit", "adjective"]
      - q: "Eles estão em férias."
        a: "Sie sind im Urlaub."
        rel:
          - ["estão", "sind (sie)", "verb - estar"]
          - ["férias", "Urlaub", "noun"]
          - ["em", "in/im", "preposition"]
  
  - title: "TER - Haben"
    explanation: |
      **TER** bedeutet "haben" und wird verwendet für:
      - Besitz
      - Alter (ter ... anos)
      - Verpflichtungen (ter de/que + Infinitiv)
      
      **Konjugation**: eu tenho, tu tens, ele/ela tem, nós temos, vós tendes, eles/elas têm
    examples:
      - q: "Eu tenho uma casa."
        a: "Ich habe ein Haus."
        rel:
          - ["tenho", "habe (ich)", "verb - ter"]
          - ["casa", "Haus", "noun"]
          - ["uma", "ein/eine", "article"]
      - q: "Tu tens dois irmãos?"
        a: "Hast du zwei Geschwister?"
        rel:
          - ["tens", "hast (du)", "verb - ter"]
          - ["irmãos", "Geschwister", "noun"]
          - ["dois", "zwei", "number"]
      - q: "Ela tem talento."
        a: "Sie hat Talent."
        rel:
          - ["tem", "hat (sie/er)", "verb - ter"]
          - ["talento", "Talent", "noun"]
      - q: "Nós temos uma reunião."
        a: "Wir haben ein Meeting."
        rel:
          - ["temos", "haben (wir)", "verb - ter"]
          - ["reunião", "Meeting", "noun"]
      - q: "Eles têm três filhos."
        a: "Sie haben drei Kinder."
        rel:
          - ["têm", "haben (sie)", "verb - ter"]
          - ["filhos", "Kinder", "noun"]
          - ["três", "drei", "number"]
  
  - title: "FAZER - Tun/Machen"
    explanation: |
      **FAZER** bedeutet "tun" oder "machen":
      - Dinge herstellen oder kreieren
      - Aktivitäten ausführen
      - Wetterausdrücke (faz calor - es ist heiß)
      
      **Konjugation**: eu faço, tu fazes, ele/ela faz, nós fazemos, vós fazeis, eles/elas fazem
    examples:
      - q: "Eu faço o pequeno-almoço."
        a: "Ich mache das Frühstück."
        rel:
          - ["faço", "mache (ich)", "verb - fazer"]
          - ["pequeno-almoço", "Frühstück", "noun"]
      - q: "Tu fazes um bom trabalho."
        a: "Du machst gute Arbeit."
        rel:
          - ["fazes", "machst (du)", "verb - fazer"]
          - ["trabalho", "Arbeit", "noun"]
          - ["bom", "gut", "adjective"]
      - q: "Ele faz exercício."
        a: "Er macht Sport."
        rel:
          - ["faz", "macht (er/sie)", "verb - fazer"]
          - ["exercício", "Sport", "noun"]
      - q: "Nós fazemos as compras."
        a: "Wir machen die Einkäufe."
        rel:
          - ["fazemos", "machen (wir)", "verb - fazer"]
          - ["compras", "Einkäufe", "noun"]
  
  - title: "IR - Gehen"
    explanation: |
      **IR** bedeutet "gehen":
      - Zu Orten gehen
      - Futur-Konstruktion (ir + Infinitiv)
      - Bewegung und Reisen
      
      **Konjugation**: eu vou, tu vais, ele/ela vai, nós vamos, vós ides, eles/elas vão
    examples:
      - q: "Eu vou ao supermercado."
        a: "Ich gehe zum Supermarkt."
        rel:
          - ["vou", "gehe (ich)", "verb - ir"]
          - ["supermercado", "Supermarkt", "noun"]
          - ["ao", "zum (zu dem)", "contraction"]
      - q: "Tu vais à praia?"
        a: "Gehst du zum Strand?"
        rel:
          - ["vais", "gehst (du)", "verb - ir"]
          - ["praia", "Strand", "noun"]
          - ["à", "zur (zu der)", "contraction"]
      - q: "Ela vai estudar medicina."
        a: "Sie wird Medizin studieren."
        labels: ["Futur"]
        rel:
          - ["vai", "geht/wird (sie/er)", "verb - ir"]
          - ["estudar", "studieren", "verb"]
          - ["medicina", "Medizin", "noun"]
      - q: "Nós vamos jantar fora."
        a: "Wir gehen auswärts essen."
        rel:
          - ["vamos", "gehen (wir)", "verb - ir"]
          - ["jantar", "essen/Abendessen", "verb/noun"]
          - ["fora", "auswärts/draußen", "adverb"]
      - q: "Eles vão viajar."
        a: "Sie werden reisen."
        labels: ["Futur"]
        rel:
          - ["vão", "gehen/werden (sie)", "verb - ir"]
          - ["viajar", "reisen", "verb"]
